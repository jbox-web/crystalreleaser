---
name: CI

# Binary-project variant of the canonical ci.yml: identical, plus the
# build_static_binaries job, since this project ships binaries.

permissions: {}

# crystalline is the Crystal LSP server, only needed in an editor.
# Its macOS binary (>= 0.18.0) is dynamically linked against
# /opt/homebrew/opt/llvm/lib/libLLVM.dylib, which is absent on the runners,
# so the plugin post_install check fails. CI never uses it, so skip installing it.
# The value must be the tool name exactly as declared in mise.toml. Shortening it
# to `crystalline` matches nothing: mise disables no tool, and the macOS jobs fail
# again on the post_install check.
env:
  MISE_DISABLE_TOOLS: aqua:elbywan/crystalline

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push to the same ref makes the run in progress pointless: cancel it
# rather than hold two sets of runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job is bounded. Without `timeout-minutes`, a step that hangs holds its
# runner for the 6 hours GitHub allows by default. The mise tasks carry their
# own `timeout`; these bound what surrounds them (checkout, tool installation,
# a runner that stalls).
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Check formatting
        run: mise dev:format-check

  ameba:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise dev:deps

      - name: Run static code analysis
        run: mise dev:ameba

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise dev:deps

      - name: Build API docs
        run: mise dev:docs

  # The release path is otherwise only exercised on a tag push, i.e. during
  # the release itself: a break there ships a release short of a platform.
  # Building it here moves the failure back to the pull request.
  #
  # Here the release path is crystalreleaser itself: `mise release:static`
  # runs `crystalreleaser build --split --snapshot`, which builds the static
  # linux binaries with docker (arm64 through QEMU), then `release --merge
  # --snapshot --skip=publish`, which packages them: the two steps of
  # release.yml, on one runner.
  build_static_binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Build static binaries
        run: mise release:static

      # An exit code of 0 says the binaries were linked, not that they start.
      # The arm64 one runs through the QEMU handlers installed above.
      - name: Run the binaries just built
        run: |
          dist/linux_amd64/crystalreleaser_linux_amd64/crystalreleaser --version
          dist/linux_arm64/crystalreleaser_linux_arm64/crystalreleaser --version

  # The cross strategy end to end, which no other job reaches: `crystal build
  # --cross-compile` for linux/arm64, then `zig cc` against a musl sysroot
  # taken from Alpine (the recipe of the README). One of the two examples
  # links OpenSSL, whose libraries crystal prints as pkg-config lookups: the
  # link line the builder has to read for real.
  test_cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Not a tool of mise.toml: only this job needs zig. The variable makes
      # mise install it and puts it on the PATH of the tasks.
      MISE_ZIG_VERSION: "0.17.1"
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The sysroot comes from an arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install zig
        run: mise install zig

      # Set from a step: the `runner` context does not exist in a job-level
      # `env:`, and a workflow that uses it there is refused as a whole.
      - name: Locate the sysroot
        run: echo "CRYSTALRELEASER_SYSROOT=$RUNNER_TEMP/sysroot" >> "$GITHUB_ENV"

      - name: Build a linux/arm64 musl sysroot
        run: |
          docker run --rm --platform linux/arm64 -v "$CRYSTALRELEASER_SYSROOT:/out" alpine:3 sh -c '
            apk add musl-dev gc-dev gc-static pcre2-dev pcre2-static yaml-static \
                    zlib-static openssl-libs-static libevent-static &&
            cp -a /lib /out/lib && mkdir -p /out/usr && cp -a /usr/lib /out/usr/lib'

      - name: Install dependencies
        run: mise dev:deps

      - name: Run the cross-compilation examples
        run: mise dev:spec -- --tag cross

  test_linux_amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The system tools that judge the formats written by hand (see
      # spec/support/packages.cr): with this, a missing one fails its example
      # instead of leaving it pending, so a broken .rpm or .deb writer cannot
      # stay green.
      SPEC_REQUIRE_TOOLS: all
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the tools the specs check the packages with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm cpio unzip

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

  test_linux_arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # The system tools that judge the formats written by hand (see
      # spec/support/packages.cr): with this, a missing one fails its example
      # instead of leaving it pending, so a broken .rpm or .deb writer cannot
      # stay green.
      SPEC_REQUIRE_TOOLS: all
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the tools the specs check the packages with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm cpio unzip

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

  # Best-effort early warning against the Crystal nightly compiler, allowed to
  # fail. mise ships no nightly build, so the container provides the compiler
  # and mise is used for its tasks alone: MISE_DISABLE_TOOLS deactivates the
  # pinned crystal, and the tasks then resolve `crystal` from PATH — the
  # container's. Job-level env REPLACES the workflow-level one, so crystalline
  # has to be repeated here or mise would try to install it.
  #
  # Going through the tasks is what makes this job mean anything: they carry the
  # `depends` that generate whatever the compilation needs (headers, baked
  # folders). Called raw, `crystal spec` can die at require time, and the canary
  # then reports nothing but its own misconfiguration.
  test_nightly_linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    container: crystallang/crystal:nightly
    env:
      MISE_DISABLE_TOOLS: crystal,aqua:elbywan/crystalline
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The nightly image is a bare Ubuntu: no curl and no ca-certificates, so
      # mise-action has nothing to fetch mise with. Add here whatever else the
      # project's own tasks shell out to.
      - name: Provision the container
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl

      - name: Setup mise
        uses: jdx/mise-action@v5

      # Kept raw rather than `mise dev:deps`: the flags skip building the
      # development executables, which a nightly compiler routinely fails to
      # build — and that failure would mask the regression this job watches.
      - name: Install dependencies
        run: shards install --skip-postinstall --skip-executables

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

  test_macos_arm64:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # As on linux, minus rpm and dpkg-deb, which macOS does not have.
      SPEC_REQUIRE_TOOLS: cpio,tar,unzip
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt

  test_macos_amd64:
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      # As on linux, minus rpm and dpkg-deb, which macOS does not have.
      SPEC_REQUIRE_TOOLS: cpio,tar,unzip
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      # TODO: remove me when https://github.com/crystal-lang/crystal/issues/16746 is fixed
      - name: Fix Crystal shards
        run: mise dev:fix-shards-command

      - name: Install dependencies
        run: mise dev:deps

      - name: Run tests
        run: mise dev:spec

      - name: Run tests (multi-threaded)
        run: mise dev:spec-mt
