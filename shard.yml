name: crystalreleaser

version: 0.1.0

crystal: ">= 1.20.0"

license: MIT

authors:
  - Nicolas Rodriguez <nico@nicoladmin.fr>

description: |
  Release automation for Crystal projects: build, archive, checksum,
  changelog, GitHub release, .deb/.rpm, Homebrew formula and aqua registry.

repository: https://github.com/jbox-web/crystalreleaser

targets:
  crystalreleaser:
    main: src/crystalreleaser.cr

# Zero dependencies: the stdlib only. Anything added under `dependencies:`
# would break that contract and must be discussed first. ameba is a mise tool
# (see mise.toml), not a development_dependency.
